<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculateur de la batterie WISC 5e édition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,600;7..72,700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#ffffff; --surface:#ffffff; --surface2:#f0f3fa; --ink:#0a0f1f; --muted:#333c5a;
  --line:#aeb8d4; --accent:#0f7d6b; --accent-ink:#ffffff; --accent-soft:#dff3ef;
  --ok:#0e6a3c; --ok-soft:#dcf3e6; --warn:#7d4700; --warn-soft:#fdf0d2; --bad:#a3170f; --bad-soft:#fde4e1;
  --serif:'Literata',Georgia,'Times New Roman',serif;
  --sans:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;padding-inline:16px;padding-block:20px 170px}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--serif);font-size:clamp(26px,6vw,36px);margin:0;letter-spacing:-.01em;line-height:1.1}
h2{font-family:var(--serif);font-size:clamp(24px,5vw,30px);margin:0;letter-spacing:-.01em;line-height:1.15}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.top p{margin:4px 0 0;color:var(--muted)}
.btn-ghost{font:inherit;font-weight:600;font-size:13px;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
.btn-ghost:hover{color:var(--ink);border-color:var(--muted)}
.btn-ghost.armed{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.btn-main{font:inherit;font-weight:600;font-size:14px;color:var(--accent-ink);background:var(--accent);border:0;border-radius:8px;padding:10px 16px;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.info label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.info input{font:inherit;font-size:17px;letter-spacing:0;text-transform:none;font-weight:500;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.info label.warn input{border-color:var(--warn)}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);padding-top:6px;margin-inline:-16px;padding-inline:16px;scrollbar-width:thin}
.tab{font:inherit;flex:0 0 auto;cursor:pointer;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:0;line-height:1.2;min-width:96px}
.tab b{font-size:15px;font-weight:600}
.tab span{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab[aria-selected="true"] span{color:var(--accent-ink);opacity:.85}

.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.rule{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15.5px}
.rule b{display:block;font-family:var(--serif);color:var(--accent);font-size:17px;margin-bottom:2px}

.status{display:flex;flex-direction:column;gap:6px}
.msg{border-radius:10px;padding:11px 14px;font-size:16px;font-weight:600;background:var(--accent-soft);color:var(--ink)}
.msg.warn{background:var(--warn-soft);color:var(--warn)}
.msg.stop{background:var(--bad-soft);color:var(--bad)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}

.group-h{font-size:13.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 0 -4px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:34px 84px 1fr;gap:8px 12px;align-items:center}
.item.plain{grid-template-columns:34px 1fr}
.item.next{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.item.off{background:transparent;border-style:dashed}
.num{font-family:var(--serif);font-weight:700;font-size:22px;color:var(--accent);text-align:center}
.meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.meta b{font-weight:600;font-size:18px}
.meta small{color:var(--muted);font-size:14.5px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.tag{font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:6px;padding:2px 7px;background:var(--accent-soft);color:var(--accent)}
.tag.back{background:var(--warn-soft);color:var(--warn)}
.ctl{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.opt{font:inherit;cursor:pointer;flex:1 1 74px;min-height:52px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1.15}
.opt strong{font-size:22px;font-variant-numeric:tabular-nums}
.opt span{font-size:13px;color:var(--muted);font-weight:600}
.opt:hover{border-color:var(--accent)}
.opt[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt[aria-checked="true"] span{color:var(--accent-ink);opacity:.85}
.opt.zero[aria-checked="true"],.opt.bad[aria-checked="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.zero[aria-checked="true"] span,.opt.bad[aria-checked="true"] span{color:#fff}
.opt.good[aria-checked="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.good[aria-checked="true"] span{color:#fff}
.opt.zero{flex:0 1 74px}
.opt.key{box-shadow:inset 0 0 0 2px var(--accent)}
.opt.sm{min-height:42px;flex:0 0 54px;padding:4px}
.opt.sm strong{font-size:18px}
.timebox{flex:1 1 130px;display:flex;flex-direction:column;justify-content:center;gap:3px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.timebox input{font:inherit;font-size:17px;width:100%;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-variant-numeric:tabular-nums;text-transform:none;letter-spacing:0}
.note{grid-column:1 / -1;border-radius:9px;padding:10px 12px;font-size:15.5px;font-weight:600;background:var(--surface2);color:var(--muted)}
.note.credit{background:var(--ok-soft);color:var(--ok)}
.note.stop{background:var(--bad-soft);color:var(--bad)}
.legend{font-size:14px;color:var(--muted)}
.hint{grid-column:1 / -1;font-size:14.5px;color:var(--warn);font-weight:500}

.dg{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:34px 1fr auto;gap:8px 12px;align-items:center}
.dg.off{background:transparent;border-style:dashed}
.dg.next{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.trials{display:flex;flex-direction:column;gap:6px;min-width:0}
.tr{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.seq{font-family:var(--serif);font-weight:700;font-size:21px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.seq small{display:block;font-family:var(--sans);font-weight:500;font-size:14px;letter-spacing:.02em;color:var(--muted)}
.tr .pair{display:flex;gap:6px}
.badge{font-family:var(--serif);font-weight:700;font-size:22px;min-width:38px;text-align:center;border-radius:9px;padding:6px 8px;background:var(--surface2);color:var(--muted);font-variant-numeric:tabular-nums}
.badge.on{background:var(--accent-soft);color:var(--accent)}
.sumcard{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;background:var(--accent-soft);border-radius:12px;padding:11px 14px}
.sumcard b{font-family:var(--serif);font-size:20px;font-variant-numeric:tabular-nums}
.sumcard span{font-size:14.5px;color:var(--muted);font-weight:600}
.ex{font-size:15px;color:var(--muted);background:var(--surface2);border-radius:9px;padding:8px 12px}
.ex b{color:var(--ink)}
.switch{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted);font-weight:600}
.switch input{width:18px;height:18px;accent-color:var(--accent)}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.card h3{margin:0;font-family:var(--serif);font-size:17px}
.card .big{font-family:var(--serif);font-weight:700;font-size:32px;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.card .big i{font-style:normal;font-size:15px;color:var(--muted);font-weight:600}
.card small{color:var(--muted);font-size:14px}
.track{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.track div{height:100%;background:var(--accent);width:0;transition:width .25s}
.row-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.flash{font-size:13px;color:var(--ok);font-weight:600}

.bar{position:fixed;left:0;right:0;bottom:0;background:#ffffff;border-top:3px solid var(--accent);box-shadow:0 -4px 14px rgba(10,15,31,.08);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.bar[hidden]{display:none!important}
.bar-in{max-width:880px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between}
.tot{display:flex;gap:16px;flex:1 1 300px;flex-wrap:wrap}
.tot div{display:flex;flex-direction:column;gap:0;flex:1 1 64px}
.tot small{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tot .v{font-family:var(--serif);font-weight:700;font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums}
.tot .v i{font-style:normal;font-size:15px;color:var(--muted);font-weight:600}
.tot .main .v{color:var(--accent)}
.prog{flex:1 1 180px;display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.track div{transition:none}}
@media (min-width:640px){
  .item{grid-template-columns:34px 84px minmax(150px,1fr) auto}
  .item.plain{grid-template-columns:34px minmax(150px,1fr) auto}
  .ctl{grid-column:auto;justify-content:flex-end;flex-wrap:nowrap}
  .opt{flex:0 0 78px}
  .opt.sm{flex:0 0 54px}
  .timebox{flex:0 0 120px}
  .note{grid-column:auto;max-width:300px}
}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:5px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.field input{font:inherit;font-size:26px;font-weight:600;font-family:var(--serif);width:100%;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-variant-numeric:tabular-nums;letter-spacing:0}
.field small{text-transform:none;letter-spacing:0;font-weight:500;font-size:14px}
.eqn{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-variant-numeric:tabular-nums}
.eqn b{font-family:var(--serif);font-size:24px}
.eqn span{font-size:14.5px;color:var(--muted);font-weight:600}
.subh{font-family:var(--serif);font-size:17px;margin:4px 0 -6px}
.tm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;padding:8px 10px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface2)}
.tm .tt{font-family:var(--serif);font-weight:700;font-size:28px;line-height:1;font-variant-numeric:tabular-nums;min-width:66px;color:var(--ink)}
.tm button{font:inherit;font-weight:700;font-size:15px;min-height:44px;padding:0 14px;border-radius:10px;border:2px solid var(--accent);background:#fff;color:var(--accent);cursor:pointer}
.tm button.go{background:var(--accent);color:#fff}
.tm .st{font-size:14px;font-weight:600;color:var(--muted)}
.tm.run{border-color:var(--accent)}
.tm.run .tt{color:var(--accent)}
.tm.low{background:var(--warn-soft);border-color:var(--warn)}
.tm.low .tt{color:var(--warn)}
.tm.over{background:var(--bad-soft);border-color:var(--bad)}
.tm.over .tt,.tm.over .st{color:var(--bad)}
.tm.over .tt{animation:tmblink .6s steps(2) 6}
@keyframes tmblink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.tm.over .tt{animation:none}}
.piece{display:grid;grid-template-columns:repeat(3,58px);gap:6px}
.piece .opt{flex:none}
.prompts{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15.5px;display:flex;flex-direction:column;gap:6px}
.prompts b{color:var(--accent);font-weight:600}
.notadm{border-radius:12px;padding:14px;background:var(--warn-soft);color:var(--warn);font-weight:600}
.tab.na{opacity:.55}
.savebar{font-size:15px;font-weight:600;color:var(--ok);background:var(--ok-soft);border-radius:10px;padding:9px 13px}
.savebar.bad{color:var(--bad);background:var(--bad-soft)}
.btn-danger{font:inherit;font-weight:700;font-size:14px;color:var(--bad);background:#fff;border:2px solid var(--bad);border-radius:8px;padding:9px 14px;cursor:pointer}
.btn-danger.armed{color:#fff;background:var(--bad)}
.chkgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.chk{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;font-weight:600;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.gate{background:var(--warn-soft);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.gate b{font-family:var(--serif);font-size:17px;color:var(--warn)}
.dsec{display:flex;flex-direction:column;gap:12px;padding-top:26px;margin-top:26px;border-top:4px solid var(--accent)}
.dsec:first-of-type{margin-top:8px}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--accent);color:#fff;border-radius:14px;padding:16px 18px}
.sechead small{display:block;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.sechead b{display:block;font-family:var(--serif);font-size:clamp(22px,6vw,28px);line-height:1.15}
.sechead span{font-size:13.5px;font-weight:600;text-align:right;line-height:1.35;opacity:.95}
</style>
</head>
<body>


<div class="wrap">
  <div class="top">
    <div>
      <h1>Calculateur de la batterie WISC 5e édition</h1>
      <p>Échelle d'intelligence de Wechsler pour enfants, 5ème édition. Cotation des 15 subtests, démarrage selon l'âge, règles de retour et d'arrêt, notes brutes.</p>
    </div>
    <button class="btn-danger" id="reset" type="button">Effacer toutes les données</button>
  </div>

  <div class="info">
    <label for="f-nom">Nom de l'enfant<input id="f-nom" type="text" autocomplete="off"></label>
    <label for="f-date">Date de passation<input id="f-date" type="date"></label>
    <label for="f-age" id="f-age-lbl">Âge (ans, 6-16)<input id="f-age" type="number" inputmode="numeric" min="6" max="16"></label>
    <label for="f-exam">Examinateur<input id="f-exam" type="text" autocomplete="off"></label>
  </div>
  <div class="savebar" id="ageinfo" role="status" aria-live="polite" style="display:none"></div>

  <div class="savebar" id="saveinfo" role="status" aria-live="polite"></div>

  <div class="tabs" id="tabs" role="tablist" aria-label="Subtests"></div>
  <div id="view" style="display:flex;flex-direction:column;gap:18px"></div>
</div>

<div class="bar" id="bar">
  <div class="bar-in">
    <div class="tot" id="tots"></div>
    <div class="prog"><span id="prog-txt"></span><div class="track"><div id="prog-bar"></div></div></div>
  </div>
</div>

<script>
(function(){
  /* ================= Âge ================= */
  var DEFAULT_AGE=10;
  function AGE(){var a=parseInt(S&&S.info&&S.info.age,10);return (a>=6&&a<=16)?a:null;}
  function ageOrDefault(){var a=AGE();return a===null?DEFAULT_AGE:a;}

  /* ================= Données lexicales ================= */
  var SIM=['Raisins - Pommes','Rouge - Vert','Papillon - Abeille','Lait - Eau','Chemise - Chaussure','Frère - Soeur','Couteau - Fourchette','Été - Hiver','Camion - Train','Triste - Heureux','Équerre - Compas','Genou - Cheville','Ciment - Argile','Électricien - Plombier','Or - Plomb','Glace - Vapeur','Éphémère - Permanent','Rivière - Montagne','Lumière - Son','Demande - Réclamation','Espace - Temps','Permettre - Empêcher','Réalité - Rêve'];
  var VOCW=['Fleur','Soleil','Seau','Poire','Savon','Médaille','Manteau','Souris','Obéir','Remède','Comestible','Ancien','Île','Rarement','Grandir','Transparent','Énervant','Précis','Nutritif','Engloutir','Migrer','Unanime','Prospecter','Persuader','Obsolète','Frugal','Aberration','Prolixe','Affable'];
  var INF=['Pied','Oreille','Mange','Pattes','Jeudi','Espèce d\'oiseau','Juin','Penser','Espèce d\'arbre','Musique','Verre d\'eau','Espace','Heures','Bougies','Pandas','Année','Points cardinaux','Mona Lisa','Coeur','Tremblement de terre','Colysée','Cité interdite','Couche d\'ozone','Feuilles','Sommet','Air chaud','« L\'étranger »','Everest','Confucius','Année lumière','Fission'];
  var COM=['Dents','Chien','Calendriers','Se laver les mains','Légumes','Ceinture de sécurité','Fumée','Pratique du sport','Tâches ménagères','Lumière','Mots de passe','Portables','Langues étrangères','Parole donnée','Examen','Invention écriture','Chandelle','Grandeur du soleil','Changements science'];
  var ARI=[['Chiens',3],['Poussins',5],['Arbres',10],['Papillons',9],['Écureuils',2],['Livres',5],['Pommes',3],['Jouets',5],['Cubes',7],['Billes',6],['Amis',15],['Poupées',14],['Ballons',8],['Jeux',25],['Oiseaux',6],['Grenouilles',5],['Tickets',9],['Lampadaires',32],['Crayons',20],['Magazine',3],['Fête',24],['Karaté',21],['Bagues',7],['Élèves',20],['Puzzle',60],['Gâteaux',3],['Livre d\'occasion',30],['Bus',11],['Pages',151],['Voitures',48],['Enfants',34],['Plantations',40],['Entraînement sportif','11h30'],['Niveaux','9 ou 8,75']];
  var MAT_KEY=[3,4,4,3,5,2,2,1,5,5,1,2,4,1,5,2,3,2,1,5,3,4,5,2,1,3,3,4,3,1,5,4];
  var BAL_KEY=[3,1,4,5,3,3,4,4,1,3,4,5,2,2,3,1,5,2,3,4,4,2,1,5,2,1,5,3,5,1,4,1,4,5];
  var PUZ_KEY=[[2,3,5],[2,4,5],[2,3,4],[1,3,5],[1,4,5],[1,2,6],[2,4,5],[3,5,6],[1,2,5],[3,4,5],[3,4,5],[2,5,6],[1,3,6],[3,4,6],[2,3,5],[2,3,4],[1,3,5],[1,2,6],[1,2,4],[3,4,6],[2,5,6],[1,3,4],[2,4,6],[3,5,6],[2,3,6],[1,4,5],[1,4,6],[1,2,4],[1,3,6]];
  var TIME_C=[{p:4,lo:71,hi:120},{p:5,lo:51,hi:70},{p:6,lo:31,hi:50},{p:7,lo:1,hi:30}];
  var CUBES=[
    {n:1,k:'t',lim:30},{n:2,k:'t',lim:45},{n:3,k:'t',lim:45},
    {n:4,k:'b',lim:45},{n:5,k:'b',lim:45},{n:6,k:'b',lim:75},{n:7,k:'b',lim:75},{n:8,k:'b',lim:75},{n:9,k:'b',lim:75},
    {n:10,k:'x',lim:120,bands:TIME_C},{n:11,k:'x',lim:120,bands:TIME_C},{n:12,k:'x',lim:120,bands:TIME_C},{n:13,k:'x',lim:120,bands:TIME_C}
  ];

  function engine(key){

  function tEngine(store,items,mode,gate){

  /* ================= Essais : Mémoire des chiffres, Lettres-Chiffres ================= */
  function trialList(store,sk,items,mode,e){
    var out='<div class="list">';
    items.forEach(function(trs,i){
      var n=i+1,x=e.st[i],off=x.mode!=='active';

        if(mode==='rev'||mode==='asc')cor='<small>Réponse correcte : '+corr(mode,seq)+'</small>';
        if(mode==='lc')cor='<small>Réponse correcte : '+corr('lc',seq)+'</small>';
        out+='<div class="tr"><div class="seq"><small style="font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em">Essai '+(j+1)+'</small>'+seq+cor+'</div>';
        if(off)out+='<span class="legend">'+(x.mode==='stopped'?'Arrêt':'')+'</span>';
        else out+='<div class="pair" role="radiogroup" aria-label="Essai '+(j+1)+' item '+n+'">'
          +'<button type="button" role="radio" class="opt sm zero" data-dg="'+sk+'" data-id="'+id+'" data-v="0" aria-checked="'+(v===0)+'"><strong>0</strong></button>'
          +'<button type="button" role="radio" class="opt sm good" data-dg="'+sk+'" data-id="'+id+'" data-v="1" aria-checked="'+(v===1)+'"><strong>1</strong></button></div>';
        out+='</div>';
      });
      if(!off){
        out+='<div class="tr" style="justify-content:space-between;border-top:1.5px solid var(--line);padding-top:8px"><span class="legend" style="font-weight:700;color:var(--ink)">Total de l\'item (calcul automatique)</span><b style="font-family:var(--serif);font-size:20px;color:var(--accent)">'+x.pts+' / '+trs.length+'</b></div>';
      }
      out+='</div><div class="badge'+(x.has&&!off?' on':'')+'" title="Total de l\'item">'+(off?'–':x.pts)+'</div></article>';

      }
    }catch(e){}
    try{if(navigator.vibrate)navigator.vibrate(count>2?[250,120,250,120,600]:[120]);}catch(e2){}
  }
  function tmDone(id,expired){
    var o=TM[id];if(!o)return;
    var secs=expired?o.lim:Math.max(1,Math.round(o.acc/1000)),ch=false,m;
    if(secs<=0)return;
    if(id==='sym'||id==='cod'){S[id].t=secs;ch=true;}
    else if((m=/^bar(\d)$/.exec(id))){S.bar['t'+m[1]]=secs;ch=true;}
    else if((m=/^cubes(\d+)$/.exec(id))){
      var n=+m[1],it=CUBES[n-1];
      if(!expired&&it&&it.bands){S.cubes.secs[n]=secs;var p=scoreFromTime(it,secs);if(p===undefined)delete S.cubes.scores[n];else S.cubes.scores[n]=p;ch=true;}
    }
    if(ch)render();
  }
  function tmStop(id,expired){
    var o=TM[id];if(!o||!o.run)return;
    o.acc=expired?o.lim*1000:tmMs(o);o.run=false;
    if(expired){o.over=true;tmBeep(4,true);}
    tmDone(id,expired);tmPaint();
  }
  function tmAct(btn){
    var box=btn.closest('.tm'),id=box.dataset.tmid,o=TM[id];if(!o)return;
    tmUnlock();
    if(btn.dataset.tmact==='rst'){o.run=false;o.acc=0;o.over=false;tmPaint();return;}
    if(o.run){tmStop(id,false);return;}
    if(o.over)return;
    Object.keys(TM).forEach(function(k){if(k!==id&&TM[k].run)tmStop(k,false);});
    o.run=true;o.t0=Date.now();tmPaint();
  }
  setInterval(function(){
    var any=false;
    Object.keys(TM).forEach(function(k){
      var o=TM[k];if(!o.run)return;any=true;
      if(tmMs(o)>=o.lim*1000)tmStop(k,true);
    });
    if(any)tmPaint();
  },200);

  /* ================= Événements ================= */
  document.addEventListener('click',function(e){
    var ta=e.target.closest('[data-tmact]');
    if(ta){tmAct(ta);return;}
    var t=e.target.closest('.tab');
    if(t){S.tab=t.dataset.tab;render();window.scrollTo(0,0);var sel=document.querySelector('.tab[aria-selected="true"]');if(sel&&sel.scrollIntoView)try{sel.scrollIntoView({inline:'center',block:'nearest'});}catch(x){}return;}
    var pr=e.target.closest('[data-prereq]');
    if(pr){
      var pid=pr.dataset.prereq,pv=pr.dataset.pv==='1';
      if(pid==='dig')S.dig.prereq67=(S.dig.prereq67===pv)?null:pv;
      else if(pid==='lcC')S.lc.prereqC=(S.lc.prereqC===pv)?null:pv;
      else if(pid==='lcA')S.lc.prereqA=(S.lc.prereqA===pv)?null:pv;
      render();return;
    }
    var pz=e.target.closest('[data-puz]');
    if(pz){
      var n=+pz.dataset.puz,p=+pz.dataset.piece,sel2=(S.puz.sel[n]||[]).slice(),ix=sel2.indexOf(p);
      delete S.puz.none[n];
      if(ix>-1)sel2.splice(ix,1);else{if(sel2.length>=3)sel2.shift();sel2.push(p);}
      S.puz.sel[n]=sel2;render();return;
    }
    var pn=e.target.closest('[data-puznone]');
    if(pn){var m=+pn.dataset.puznone;if(S.puz.none[m])delete S.puz.none[m];else{S.puz.none[m]=true;S.puz.sel[m]=[];}render();return;}
    var b=e.target.closest('.opt');
    if(b){
      var v=+b.dataset.v;
      if(b.dataset.dg){
        var d=storeOf(b.dataset.dg),id=b.dataset.id;
        if(d[id]===v)delete d[id];else d[id]=v;
      }else{
        var k=b.dataset.k,nn=+b.dataset.n;
        if(k==='mat'||k==='bal'){if(S[k].ans[nn]===v)delete S[k].ans[nn];else S[k].ans[nn]=v;}
        else{
          var sc=S[k].scores;
          if(sc[nn]===v)delete sc[nn];else sc[nn]=v;
          if(k==='cubes')delete S.cubes.secs[nn];
        }
      }
      render();return;
    }
    if(e.target.id==='dopdf'){exportPdf();return;}
  });
  document.addEventListener('change',function(e){
    if(e.target.id==='showkey'){S.showKey=e.target.checked;render();}
  });
  document.addEventListener('input',function(e){
    var t=e.target;
    if(t.dataset&&t.dataset.time){
      var n=+t.dataset.time,it=CUBES[n-1],sec=parseInt(t.value,10);
      if(isNaN(sec)||sec<=0){delete S.cubes.secs[n];delete S.cubes.scores[n];}
      else{S.cubes.secs[n]=sec;var p=scoreFromTime(it,sec);if(p===undefined)delete S.cubes.scores[n];else S.cubes.scores[n]=p;}
      render();return;
    }
    if(t.dataset&&t.dataset.store){
      var val=parseInt(t.value,10),st=S[t.dataset.store];
      if(isNaN(val)||val<0)delete st[t.dataset.field];else st[t.dataset.field]=val;
      render();return;
    }
    var m={'f-nom':'nom','f-date':'date','f-exam':'exam','f-age':'age'}[t.id];
    if(m){S.info[m]=t.value;save();render();}
  });
  ['nom','date','exam','age'].forEach(function(k){var el=document.getElementById('f-'+k);if(el)el.value=S.info[k]||'';});

  var rb=document.getElementById('reset'),armed=false,tmr;
  rb.addEventListener('click',function(){
    if(!armed){armed=true;rb.classList.add('armed');rb.textContent='Confirmer : tout effacer';tmr=setTimeout(off,5000);return;}
    S=blank();restored=false;TM={};
    ['nom','date','exam','age'].forEach(function(k){var el=document.getElementById('f-'+k);if(el)el.value='';});
    clearTimeout(tmr);off();render();
  });
  function off(){armed=false;rb.classList.remove('armed');rb.textContent='Effacer toutes les données';}
  render();
})();
</script>

</body>
</html>
